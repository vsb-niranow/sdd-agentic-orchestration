# Prompt registry.
#
# This is the single source of truth linking `prompt_id@vN` references in
# capability specs to the prompt files on disk. The CI job
# `.github/workflows/prompt-delta-coupling.yaml` and the lint rule
# `prompt_registry_coherent.py` both key off this file.
#
# NEVER edit a prompt file without:
#   1. Bumping the version suffix (v7 → v8), AND
#   2. Updating the sha256 here, AND
#   3. Opening a spec delta that moves the capability's `resources.prompts.id`
#      reference to the new version in the SAME commit.
#
# Owners: capability that owns the prompt. Used by the coupling CI job to
# resolve which capability's spec must be amended when a prompt changes.

essay_feedback:
  latest: 7
  owner_capability: essay-feedback
  versions:
    - { v: 7, sha256: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678901234567890abcdef123456, created: "2026-01-14" }
    - { v: 6, sha256: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef, created: "2025-11-02" }

essay_feedback_v7_fallbacks:
